[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leapgo-s3-storage"
version = "1.0.0"
description = "Python SDK for S3-compatible object storage (RustFS/MinIO/OSS/S3)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LeapGo", email = "leapgo@yeah.net"},
]
keywords = ["s3", "storage", "minio", "rustfs", "boto3", "object-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = ["boto3>=1.34.0", "botocore>=1.34.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/pengbw/s3-storage"
Documentation = "https://github.com/pengbw/s3-storage#readme"
Repository = "https://github.com/pengbw/s3-storage"

[tool.setuptools.packages.find]
where = ["."]
src-layout = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
